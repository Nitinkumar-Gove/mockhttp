<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>mockhttp | Interactive API Playground</title>
  
  <!-- Inline theme initializer to prevent flash of wrong theme -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('mockhttp_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>

  <!-- Typography matching nitinkumargove.com -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
  <link rel="icon" type="image/png" href="https://unpkg.com/swagger-ui-dist@5/favicon-32x32.png" />
  
  <style>
    /* Dark Theme (Default) */
    :root, [data-theme="dark"] {
      --bg: #1c1714;
      --bg-card: #211d19;
      --bg-input: #2a2520;
      --bg-code: #151210;
      --fg: #f0ede6;
      --fg-muted: #9e9a93;
      --border: #3d3830;
      --link: #d4775a;
      --btn-toggle-bg: #2a2520;
      --btn-toggle-border: #3d3830;
      --btn-toggle-color: #f0ede6;
      --opblock-get-border: rgba(46, 204, 113, 0.35);
      --opblock-get-bg: rgba(46, 204, 113, 0.04);
      --badge-bg: rgba(46, 204, 113, 0.15);
      --badge-border: rgba(46, 204, 113, 0.4);
      --badge-color: #2ecc71;
    }

    /* Light Theme as on nitinkumargove.com */
    [data-theme="light"] {
      --bg: #f4f3ee;
      --bg-card: #eceae3;
      --bg-input: #ffffff;
      --bg-code: #e5e2d9;
      --fg: #1c1714;
      --fg-muted: #7a756e;
      --border: #d9d7cf;
      --link: #c15f3c;
      --btn-toggle-bg: #eceae3;
      --btn-toggle-border: #d9d7cf;
      --btn-toggle-color: #1c1714;
      --opblock-get-border: rgba(39, 174, 96, 0.45);
      --opblock-get-bg: rgba(39, 174, 96, 0.08);
      --badge-bg: rgba(39, 174, 96, 0.15);
      --badge-border: rgba(39, 174, 96, 0.45);
      --badge-color: #27ae60;
    }

    * {
      box-sizing: border-box;
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    body, html {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--fg);
      font-family: "Geist", -apple-system, BlinkMacSystemFont, "Roboto", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .topbar {
      display: none !important;
    }

    .brand-header-wrapper {
      border-bottom: 1px solid var(--border);
      background-color: var(--bg);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(8px);
    }

    .brand-header {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 12px;
      letter-spacing: -0.02em;
    }

    .brand-title a {
      color: var(--fg);
      text-decoration: none;
    }

    .badge-live {
      background: var(--badge-bg);
      border: 1px solid var(--badge-border);
      color: var(--badge-color);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .brand-nav {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .brand-nav a {
      color: var(--fg-muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: color 0.15s ease;
    }

    .brand-nav a:hover {
      color: var(--link);
    }

    /* Theme Toggle Button */
    .theme-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--btn-toggle-bg);
      border: 1px solid var(--btn-toggle-border);
      color: var(--btn-toggle-color);
      padding: 6px 12px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }

    .theme-toggle-btn:hover {
      border-color: var(--link);
      color: var(--link);
    }

    .theme-icon {
      width: 14px;
      height: 14px;
      display: block;
    }

    [data-theme="dark"] .icon-moon {
      display: none;
    }

    [data-theme="dark"] .icon-sun {
      display: block;
    }

    [data-theme="light"] .icon-sun {
      display: none;
    }

    [data-theme="light"] .icon-moon {
      display: block;
    }

    /* 1200px max width container */
    .swagger-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 10px 24px 80px 24px;
    }

    /* Swagger UI Theme matching active palette */
    .swagger-ui {
      color: var(--fg);
      font-family: "Geist", -apple-system, BlinkMacSystemFont, "Roboto", sans-serif;
    }

    .swagger-ui .info {
      margin: 28px 0 16px 0;
    }

    .swagger-ui .info .title {
      color: var(--fg) !important;
      font-family: inherit !important;
      font-weight: 700;
      font-size: 2.1rem;
      letter-spacing: -0.025em;
    }

    .swagger-ui .info p,
    .swagger-ui .info li {
      color: var(--fg-muted) !important;
      font-size: 1.05rem;
      line-height: 1.65;
    }

    .swagger-ui .info a {
      color: var(--link) !important;
    }

    .swagger-ui .scheme-container {
      background: var(--bg-card) !important;
      border: 1px solid var(--border) !important;
      border-radius: 8px;
      box-shadow: none !important;
      margin: 20px 0 30px 0;
      padding: 16px 20px;
    }

    .swagger-ui .scheme-container label {
      color: var(--fg-muted) !important;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .swagger-ui select {
      background-color: var(--bg-input) !important;
      color: var(--fg) !important;
      border: 1px solid var(--border) !important;
      border-radius: 6px;
      font-family: inherit !important;
      font-size: 0.95rem;
      padding: 8px 12px;
      cursor: pointer;
    }

    .swagger-ui input[type="text"] {
      background-color: var(--bg-input) !important;
      color: var(--fg) !important;
      border: 1px solid var(--border) !important;
      border-radius: 6px;
      font-family: "Geist Mono", monospace !important;
      padding: 8px 12px;
    }

    .swagger-ui .opblock-tag {
      color: var(--fg) !important;
      border-bottom: 1px solid var(--border) !important;
      font-family: inherit !important;
      font-size: 1.35rem;
      font-weight: 600;
      margin: 20px 0 12px 0;
      padding-bottom: 8px;
    }

    .swagger-ui .opblock-tag small {
      color: var(--fg-muted) !important;
      font-size: 0.9rem;
      font-weight: 400;
    }

    .swagger-ui .opblock {
      background: var(--bg-card) !important;
      border: 1px solid var(--border) !important;
      border-radius: 8px;
      box-shadow: none !important;
      margin-bottom: 18px;
    }

    .swagger-ui .opblock.opblock-get {
      border-color: var(--opblock-get-border) !important;
      background: var(--opblock-get-bg) !important;
    }

    .swagger-ui .opblock .opblock-summary {
      border-color: var(--border) !important;
      padding: 10px 16px;
    }

    .swagger-ui .opblock .opblock-summary-method {
      background: #2ecc71 !important;
      border-radius: 5px;
      font-weight: 700;
    }

    .swagger-ui .opblock .opblock-summary-path {
      color: var(--fg) !important;
      font-family: "Geist Mono", monospace !important;
      font-size: 1.05rem;
      font-weight: 600;
    }

    .swagger-ui .opblock .opblock-summary-description {
      color: var(--fg-muted) !important;
      font-family: inherit !important;
    }

    .swagger-ui .opblock-body {
      background: var(--bg) !important;
      border-top: 1px solid var(--border);
      padding: 20px;
    }

    .swagger-ui .opblock-section-header {
      background: var(--bg-card) !important;
      border-bottom: 1px solid var(--border);
      box-shadow: none !important;
      padding: 8px 12px;
    }

    .swagger-ui .opblock-section-header h4 {
      color: var(--fg) !important;
      font-family: inherit !important;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .swagger-ui .parameter__name {
      color: var(--fg) !important;
      font-family: "Geist Mono", monospace !important;
      font-weight: 600;
    }

    .swagger-ui .parameter__type {
      color: var(--fg-muted) !important;
      font-family: "Geist Mono", monospace !important;
    }

    .swagger-ui .parameter__in {
      color: var(--fg-muted) !important;
    }

    .swagger-ui .parameter__extension,
    .swagger-ui .parameter__deprecated {
      color: var(--fg-muted) !important;
    }

    .swagger-ui table thead tr td,
    .swagger-ui table thead tr th {
      color: var(--fg-muted) !important;
      border-bottom: 1px solid var(--border) !important;
      font-family: inherit !important;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .swagger-ui .tabli button {
      color: var(--fg-muted) !important;
      font-family: inherit !important;
    }

    .swagger-ui .tabli.active button {
      color: var(--link) !important;
      font-weight: 600;
    }

    .swagger-ui .btn.execute {
      background-color: var(--link) !important;
      border-color: var(--link) !important;
      color: #ffffff !important;
      border-radius: 6px;
      font-weight: 600;
      padding: 9px 28px;
      transition: opacity 0.15s ease;
    }

    .swagger-ui .btn.execute:hover {
      opacity: 0.9;
    }

    .swagger-ui .btn.btn-clear,
    .swagger-ui .btn.try-out__btn {
      background: var(--bg-input) !important;
      border: 1px solid var(--border) !important;
      color: var(--fg) !important;
      border-radius: 6px;
    }

    .swagger-ui .responses-inner {
      background: transparent !important;
    }

    .swagger-ui .responses-table th,
    .swagger-ui .responses-table td {
      color: var(--fg) !important;
      border-bottom: 1px solid var(--border) !important;
    }

    .swagger-ui .response-col_status {
      color: var(--fg) !important;
      font-family: "Geist Mono", monospace !important;
      font-weight: 600;
    }

    .swagger-ui .response-col_description {
      color: var(--fg) !important;
    }

    .swagger-ui .response-col_links {
      color: var(--fg-muted) !important;
    }

    .swagger-ui .response-control-media-type__title {
      color: var(--fg-muted) !important;
    }

    .swagger-ui pre,
    .swagger-ui code,
    .swagger-ui .microlight,
    .swagger-ui .highlight-code pre {
      background: var(--bg-code) !important;
      color: var(--fg) !important;
      border: 1px solid var(--border) !important;
      border-radius: 6px;
      font-family: "Geist Mono", monospace !important;
    }

    .swagger-ui .copy-to-clipboard button {
      background: var(--bg-input) !important;
      border: 1px solid var(--border) !important;
      border-radius: 4px;
    }

    .swagger-ui .response__duration {
      color: #2ecc71 !important;
      font-family: "Geist Mono", monospace !important;
      font-weight: 600;
    }

    .swagger-ui .renderedMarkdown p {
      color: var(--fg) !important;
    }
  </style>
</head>
<body>
  <div class="brand-header-wrapper">
    <header class="brand-header">
      <div class="brand-title">
        <a href="https://nitinkumar-gove.github.io/mockhttp/">mockhttp</a>
        <span class="badge-live">Live API</span>
      </div>
      <nav class="brand-nav">
        <a href="https://mockhttp.onrender.com/status/200" target="_blank" rel="noopener">Live Endpoint ↗</a>
        <a href="https://github.com/Nitinkumar-Gove/mockhttp" target="_blank" rel="noopener">GitHub Repository ↗</a>
        <button id="theme-toggle" class="theme-toggle-btn" type="button" aria-label="Toggle theme" title="Toggle light/dark theme">
          <svg class="theme-icon icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          <svg class="theme-icon icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          <span id="theme-toggle-text">Light</span>
        </button>
      </nav>
    </header>
  </div>

  <main class="swagger-container">
    <div id="swagger-ui"></div>
  </main>

  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js" crossorigin></script>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js" crossorigin></script>
  <script>
    // Theme toggle interaction
    const initThemeToggle = () => {
      const toggleBtn = document.getElementById('theme-toggle');
      const labelText = document.getElementById('theme-toggle-text');

      const applyTheme = (theme) => {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('mockhttp_theme', theme);
        labelText.textContent = theme === 'dark' ? 'Light' : 'Dark';
      };

      const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
      labelText.textContent = currentTheme === 'dark' ? 'Light' : 'Dark';

      toggleBtn.addEventListener('click', () => {
        const active = document.documentElement.getAttribute('data-theme') || 'dark';
        const next = active === 'dark' ? 'light' : 'dark';
        applyTheme(next);
      });
    };

    window.onload = () => {
      initThemeToggle();

      window.ui = SwaggerUIBundle({
        spec: {
          openapi: "3.0.3",
          info: {
            title: "mockhttp API",
            version: "1.0.0",
            description: "A lightweight live API to simulate HTTP status codes, custom messages, and network latency delays. Test endpoints interactively below against the hosted API on Render."
          },
          servers: [
            {
              url: "https://mockhttp.onrender.com",
              description: "Production Server (Render)"
            },
            {
              url: "http://localhost:8080",
              description: "Local Development Server"
            }
          ],
          paths: {
            "/status/{statusCode}": {
              get: {
                tags: ["Status Mocking"],
                summary: "Mock an HTTP response code",
                description: "Returns an HTTP response matching the given status code with optional custom message and simulated delay.",
                operationId: "mockHttpStatus",
                parameters: [
                  {
                    name: "statusCode",
                    in: "path",
                    required: true,
                    description: "Standard HTTP status code (100–599)",
                    schema: {
                      type: "integer",
                      example: 200
                    }
                  },
                  {
                    name: "message",
                    in: "query",
                    required: false,
                    description: "Optional custom message or error description to return in the JSON payload",
                    schema: {
                      type: "string",
                      example: "Operation completed successfully"
                    }
                  },
                  {
                    name: "delayMs",
                    in: "query",
                    required: false,
                    description: "Optional delay in milliseconds before returning response (test latency & timeouts)",
                    schema: {
                      type: "integer",
                      example: 500
                    }
                  }
                ],
                responses: {
                  "200": {
                    description: "Mocked success response",
                    content: {
                      "application/json": {
                        schema: {
                          type: "object",
                          properties: {
                            message: {
                              type: "string",
                              example: "Mocked response for status 200"
                            }
                          }
                        }
                      }
                    }
                  },
                  "400": {
                    description: "Bad Request (e.g. invalid status code or non-numeric parameter)",
                    content: {
                      "application/json": {
                        schema: {
                          type: "object",
                          properties: {
                            error: {
                              type: "string",
                              example: "Invalid HTTP status code: 999"
                            }
                          }
                        }
                      }
                    }
                  },
                  "404": {
                    description: "Mocked client error response",
                    content: {
                      "application/json": {
                        schema: {
                          type: "object",
                          properties: {
                            error: {
                              type: "string",
                              example: "Mocked response for status 404"
                            }
                          }
                        }
                      }
                    }
                  },
                  "500": {
                    description: "Mocked server error response",
                    content: {
                      "application/json": {
                        schema: {
                          type: "object",
                          properties: {
                            error: {
                              type: "string",
                              example: "Mocked response for status 500"
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        },
        dom_id: "#swagger-ui",
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        layout: "BaseLayout",
        tryItOutEnabled: true,
        displayRequestDuration: true,
        docExpansion: "full",
        defaultModelsExpandDepth: -1
      });
    };
  </script>
</body>
</html>
